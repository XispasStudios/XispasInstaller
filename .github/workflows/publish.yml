name: Publish authorized Xispa binary

on:
  push:
    branches: [main]
    paths:
      - 'distribution/**'
      - '.github/workflows/publish.yml'
      - '.github/scripts/publish.cjs'

permissions:
  contents: read

concurrency:
  group: xispa-stable-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false }} # Windows 0.3.78: fin de mantenimiento; no publicar nuevas actualizaciones Windows.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Read the authorized distribution commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved from GitHub
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Use Node.js for signature and binary verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reconstruct and publish only the signed executable and manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish.cjs
